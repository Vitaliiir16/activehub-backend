name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mailpit:
        image: axllent/mailpit@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s --health-timeout 3s --health-retries 20
      postgres:
        image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
        env:
          POSTGRES_DB: activehub_test
          POSTGRES_USER: activehub
          POSTGRES_PASSWORD: ephemeral_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U activehub -d activehub_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: activehub
      PGPASSWORD: ephemeral_ci_only
      PGDATABASE: activehub_test
      INITIAL_ADMIN_EMAIL: ci-admin@example.test
      INITIAL_ADMIN_PASSWORD: EphemeralCiPassword123
      INITIAL_ADMIN_NAME: CI Administrator
      APP_ORIGINS: http://127.0.0.1:3100
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      MAILPIT_BASE_URL: http://127.0.0.1:8025
      UPLOAD_DIR: /tmp/activehub-test-uploads
      ACTIVEHUB_TEST_WRITES: "true"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run contract:check
      - run: npm run db:init
      - run: npm run db:verify
      - run: npm run build
      - run: npm run test:accounts
      - run: npm run test:marketplace
      - run: npm run test:loyalty
