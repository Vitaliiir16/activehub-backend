name: ${COMPOSE_PROJECT_NAME:-activehub}

x-backend: &backend
  build:
    context: .
    target: runtime
  image: ${COMPOSE_PROJECT_NAME:-activehub}-backend:local
  init: true
  environment: &backend-env
    NODE_ENV: production
    PGHOST: db
    PGPORT: 5432
    PGUSER: ${POSTGRES_USER:-activehub}
    PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    PGDATABASE: ${POSTGRES_DB:-activehub}
    APP_ORIGIN: http://localhost:${FRONTEND_PORT:-8080}
    APP_ORIGINS: ${APP_ORIGINS:-http://localhost:${FRONTEND_PORT:-8080},http://127.0.0.1:${FRONTEND_PORT:-8080}}
    SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
    BOOKING_CUTOFF_SECONDS: ${BOOKING_CUTOFF_SECONDS:-1800}
    CANCELLATION_CUTOFF_SECONDS: ${CANCELLATION_CUTOFF_SECONDS:-43200}
    PAYMENT_DEADLINE_SECONDS: ${PAYMENT_DEADLINE_SECONDS:-3600}
    PENDING_DEADLINE_SECONDS: ${PENDING_DEADLINE_SECONDS:-172800}
    BOOKING_WORKER_INTERVAL_SECONDS: ${BOOKING_WORKER_INTERVAL_SECONDS:-60}
    PAYMENT_SIMULATION_MS: ${PAYMENT_SIMULATION_MS:-1250}
    SMTP_HOST: ${SMTP_HOST:-mailpit}
    SMTP_PORT: ${SMTP_PORT:-1025}
    SMTP_SECURE: ${SMTP_SECURE:-}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-}
    SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ActiveHub}
    SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-}
    SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-}
    APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:${FRONTEND_PORT:-8080}}
    EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-50}
    REMINDER_FIRST_SECONDS: ${REMINDER_FIRST_SECONDS:-86400}
    REMINDER_SECOND_SECONDS: ${REMINDER_SECOND_SECONDS:-7200}
    REMINDER_WORKER_INTERVAL_SECONDS: ${REMINDER_WORKER_INTERVAL_SECONDS:-60}
    UPLOAD_DIR: /app/uploads
  stop_grace_period: 15s

services:
  db:
    image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-activehub}
      POSTGRES_USER: ${POSTGRES_USER:-activehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    <<: *backend
    command: [node, --import, tsx, scripts/init-db.ts]
    environment:
      <<: *backend-env
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?Set INITIAL_ADMIN_EMAIL in .env}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in .env}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Initial Administrator}
      SEED_DEMO: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, --import, tsx, scripts/check-health.ts]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend
    restart: unless-stopped
    command: [node, --import, tsx, scripts/worker.ts]
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, scripts/check-worker.mjs]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  mailpit:
    image: axllent/mailpit@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mail:/data
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ../activehub-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  database:
  uploads:
  mail:
